# See: https://bevy.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


[workspace]
members = [
    "apps/octopus-cli",
    "crates/llm-provider",
    "crates/agent-core",
    "crates/faf-units",
    "crates/faf-dioxus-ui",
    "crates/faf-blueprints",
    "crates/faf-unit-tools",
    "plugins/example-http",
    "plugins/faf-units",
    "plugins/faf-party",
    "apps/faf-sim-cli",
    "apps/fafcn-server",
    "apps/qqbot",
    "apps/qqbot-core",
    "xtask",
    "crates/faf-game-engine",
    "apps/breakout",
    "crates/faf-sim-service",
    "crates/faf-sim-protocol",
    "apps/fafcn-web",
    "crates/fafcn-gamedata",
    "apps/fafcn-sync",
    "crates/faf-ml-core",
    "crates/faf-ml-model",
    "crates/faf-ml-datagen",
    "apps/faf-ml-server",
    "apps/faf-ml-web",
    "apps/faf-ml-mcp",
]
resolver = "3"

[workspace.dependencies]
# Path crates
faf-dioxus-ui = { path = "crates/faf-dioxus-ui" }
faf-blueprints = { path = "crates/faf-blueprints" }
faf-sim-shared = { path = "crates/faf-sim-shared" }
faf-sim-protocol = { path = "crates/faf-sim-protocol" }
faf-game-engine = { path = "crates/faf-game-engine" }
faf-units = { path = "crates/faf-units" }
faf-sim-service = { path = "crates/faf-sim-service" }
fafcn-gamedata = { path = "crates/fafcn-gamedata" }
faf-ml-core = { path = "crates/faf-ml-core" }
faf-ml-datagen = { path = "crates/faf-ml-datagen" }
faf-ml-model = { path = "crates/faf-ml-model" }
llm-provider = { path = "crates/llm-provider" }
agent-core = { path = "crates/agent-core" }
qqbot-config = { path = "crates/qqbot-config" }

# Common external crates
bevy = "0.19"
bevy_app = "0.19"
bevy_ecs = "0.19"
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
bytes = "1"
burn = { version = "0.21", default-features = false, features = [
    "std",
    "autodiff",
] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
console_error_panic_hook = "0.1"
clap = { version = "4", features = ["derive"] }
dioxus = { version = "0.7", default-features = false, features = [
    "web",
    "lib",
    "launch",
] }
extism = "1"
extism-pdk = "1"
futures = "0.3"
getrandom = "0.2"
gloo-net = "0.6"
futures-util = "0.3"
http = "1"
petgraph = "0.8"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
rusqlite = { version = "0.33", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
burn-train = { version = "0.21", default-features = false }
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio-test = "0.4"
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["js"] }
walkdir = "2"
wasm-bindgen = "0.2"
web-sys = "0.3"
